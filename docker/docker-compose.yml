name: midas-rhh

services:
  mysql:
    image: mysql:8.4
    container_name: midas-rhh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}     # Docker crea la BD sola en el primer arranque
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Guayaquil
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=-05:00
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql    # volumen de Docker: los datos no viven en el repositorio
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
  vault:
    image: hashicorp/vault:1.19
    container_name: midas-rhh-vault
    restart: "no"          # modo dev = memoria: se repone con "up -d"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?Defina VAULT_DEV_ROOT_TOKEN en .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: [ "server", "-dev" ]
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 5s
      timeout: 3s
      retries: 12

  vault-init:
    image: hashicorp/vault:1.19
    container_name: midas-rhh-vault-init
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c", "tr -d '\\r' < /init-vault.sh > /tmp/init.sh && sh /tmp/init.sh" ]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?Defina VAULT_DEV_ROOT_TOKEN en .env}
      DB_USER: ${DB_USER:?Defina DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      AD_URL_BASE: ${AD_URL_BASE:?Defina AD_URL_BASE en .env}
      AD_TOKEN: ${AD_TOKEN:-}
    volumes:
      - ./vault/init-vault.sh:/init-vault.sh:ro
      - ./runtime:/runtime
volumes:
  mysql_data:
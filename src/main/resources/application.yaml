server:
  servlet:
    context-path: /api/v1/roles-pago
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: rol-pagos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      # Solo existen en tu equipo (están en .gitignore). "optional:" evita el error en producción
      - optional:file:./.env[.properties]
      - optional:file:./docker/runtime/vault-approle.properties
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    table: FLYWAY_SCHEMA_HISTORY
    locations: classpath:db/migration
server:
  servlet:
    context-path: /api/v1/roles-pago
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: rol-pagos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      # Solo existen en tu equipo (están en .gitignore). "optional:" evita el error en producción
      - optional:file:./.env[.properties]
      - optional:file:./docker/runtime/vault-approle.properties
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    table: FLYWAY_SCHEMA_HISTORY
    locations: classpath:db/migration

app:
  ad:
    url-base: ${ad.url-base:}          # llega desde Vault
    token: ${ad.token:}                # llega desde Vault (puede estar vacío)
    dominio-correo: coopsanjose.fin.ec
    timeout-conexion: 5s
    timeout-lectura: 30s
    cuentas-excluidas:                 # cuentas genéricas que no son una persona
      - admin
      - publicaciones
      - auditor_sbs
    sincronizacion:
      habilitada: false                # la programación nocturna llega en la Parte 2
      cron: "0 0 3 * * *"
      porcentaje-minimo: 50            # protección contra respuestas parciales del AD
server:
  servlet:
    context-path: /api/v1/roles-pago
  tomcat:
    max-part-count: 600          # archivos por carga masiva (por defecto Tomcat permite 50)
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: rol-pagos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      # Solo existen en tu equipo (están en .gitignore). "optional:" evita el error en producción
      - optional:file:./.env[.properties]
      - optional:file:./docker/runtime/vault-approle.properties
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 100MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    table: FLYWAY_SCHEMA_HISTORY
    locations: classpath:db/migration

app:
  ad:
    url-base: ${ad.url-base:}          # llega desde Vault
    token: ${ad.token:}                # llega desde Vault (puede estar vacío)
    dominio-correo: coopsanjose.fin.ec
    timeout-conexion: 5s
    timeout-lectura: 30s
    cuentas-excluidas:                 # cuentas genéricas que no son una persona
      - admin
      - publicaciones
      - auditor_sbs
    sincronizacion:
      habilitada: false
      cron: "0 0 3 * * *"
      porcentaje-minimo: 50            # protección contra respuestas parciales del AD
  roles:
    ruta-base: ${ROLES_RUTA_BASE:./data/roles-pago}   # en producción lo define TI
    tamano-maximo-archivo: 5MB
    max-archivos-por-carga: 500
    max-paginas: 1
  seguridad:
    administradores-iniciales: # ADMIN desde el arranque. No se pueden quitar desde la API, solo aquí
      - fsepa
      - msavala
    limite-intentos: # defensa contra quien prueba cédulas ajenas
      maximo: 5
      ventana: 15m
  jwt:
    clave-publica: ${jwt.public-key:}                  # PRODUCCIÓN: llega desde Vault (clave jwt.public-key)
    clave-publica-archivo: ${JWT_PUBLIC_KEY_FILE:}     # solo desarrollo
    vida-maxima: PT24H5M          # sesión de 24 h del autenticador + 5 min. Rechaza los tokens de renovación (7 días)
    desfase-reloj: 60s
  correo:
    modo: API                                 # API | SIMULADO (SIMULADO solo en el perfil dev)
    resultado-simulado: OK                    # OK | FALLO_TEMPORAL | FALLO_DEFINITIVO (solo con modo SIMULADO)
    api:
      url: ${correo.api.url:}                 # en producción llega desde Vault
      token: ${correo.api.token:}             # en producción llega desde Vault
      cabecera-autorizacion: Authorization    # ajustar al contrato (p. ej. X-API-Key)
      esquema: Bearer                         # vacío = el token va solo, sin prefijo
      cabecera-idempotencia: ""               # p. ej. Idempotency-Key, si la API lo soporta
      timeout-conexion: 5s
      timeout-lectura: 15s
      canal: EMAIL                            # canal que espera la API
      codigo-plantilla: ""                    # vacío = se envían el asunto y el texto propios; con valor = plantilla de la API
      variables: { }                           # variables FIJAS de la plantilla (p. ej. NombreEmpresa)
      redirigir-a: ""                         # SOLO PRUEBAS: con valor, TODO aviso sale a esta única dirección
      # ssl-bundle: correo-api                # solo si la API usa un certificado de CA interna
  notificaciones:
    habilitada: false                         # se enciende por entorno
    despacho-automatico: true                 # false = la cola se llena pero no se envía
    intervalo-ms: 30000                       # cada cuánto se revisa la cola
    lote: 50                                  # avisos por revisión
    max-intentos: 5                           # después de esto el aviso queda FALLIDO
    url-sistema: ""                           # enlace al sistema que lleva el correo
# Los secretos NUNCA van aquí: se siembran en el Vault de producción.
#   vault kv put secret/rol-pagos-backend/db   db.username=... db.password=...
#   vault kv put secret/rol-pagos-backend/ad   ad.url-base=https://...  ad.token='...'
#   vault kv put secret/rol-pagos-backend/jwt  jwt.public-key=@clave-publica-produccion.pem
#   vault kv put secret/rol-pagos-backend/correo correo.api.url=https://...  correo.api.token='...'
#
# server:
#   forward-headers-strategy: native     # SOLO detrás de un proxy de confianza (Traefik/Nginx): da la IP real del cliente

# =====================================================================================================
# PRODUCCIÓN.   Se activa con SPRING_PROFILES_ACTIVE=prod  (la imagen ya lo trae por defecto y el flujo de producción lo fija).
# BORRADOR: no se ha probado en un servidor. NO active el despliegue a producción hasta que TI confirme el Vault y la base.
#
# Es igual que application-test.yml con CUATRO diferencias deliberadas:
#   1. NO hay redirección de correo: los avisos salen a las personas reales.
#   2. Los avisos están APAGADOS por defecto: se encienden con la clave notificaciones_habilitada=true en el Vault, cuando TI lo apruebe.
#   3. Pool de conexiones más grande (como en la plantilla de TI).
#   4. Con el perfil "prod" la aplicación se NIEGA a arrancar si alguien habilita la identificación de desarrollo (X-Dev-Usuario).
# Lee de:   secret/coacsanjose/<SPRING_APPLICATION_NAME>        y        secret/coacsanjose/<SPRING_APPLICATION_NAME>/prod
# =====================================================================================================
spring:
  config:
    import:
      - "vault://"
  cloud:
    vault:
      enabled: true
      uri: ${VAULT_URI}
      kv:
        enabled: true
        backend: secret
        default-context: coacsanjose/${spring.application.name}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
     # fail-fast: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${db_url}
    username: ${db_username}
    password: ${db_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
  ssl:
    bundle:
      pem:
        ad:
          truststore:
            certificate: file:${ad_ca_file:/app/certs/ca-ad.crt}
server:
  forward-headers-strategy: native
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  seguridad:
    dev-auth-habilitado: false
  ad:
    url-base: ${ad_url_base}
    token: ${ad_token:}
    ssl-bundle: ad
  jwt:
    clave-publica: ${jwt_public_key}   # la clave pública del autenticador de PRODUCCIÓN (distinta de la de desarrollo y pre-producción)
  roles:
    ruta-base: ${roles_ruta_base:/datos/roles-pago}
  cors:
    origenes-permitidos: ${cors_allowed_origins}
    cabeceras-permitidas:
      - Authorization
      - Content-Type
  correo:
    modo: API
    api:
      url: ${correo_api_url}
      token: ${correo_api_token:}
      ssl-bundle: ad
      codigo-plantilla: ${correo_codigo_plantilla:ACCOUNT_ACTIVATE}
      # SIN redirigir-a: en producción cada aviso va a su destinatario real
    individual:
      url: ${correo_api_url_individual:}
  notificaciones:
    habilitada: ${notificaciones_habilitada:false}
    url-sistema: ${front_url}

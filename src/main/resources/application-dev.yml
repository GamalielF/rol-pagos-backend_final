server:
  address: 127.0.0.1   # solo escucha en este equipo: en dev se puede suplantar a cualquier usuario

spring:
  config:
    import:
      - vault://secret/rol-pagos-backend/db
      - vault://secret/rol-pagos-backend/ad
  ssl:
    bundle:
      pem:
        ad:
          truststore:
            certificate: file:./certs/ca-ad.crt   # CA del AD (solo certificados públicos)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil
    username: ${db.username}
    password: ${db.password}
  jpa:
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
  cloud:
    vault:
      enabled: true
      uri: http://localhost:${VAULT_PORT:8200}
      authentication: APPROLE
      kv:
        enabled: true
        backend: secret
      fail-fast: true

app:
  seguridad:
    dev-auth-habilitado: true
  ad:
    ssl-bundle: ad
  cors:
    origenes-permitidos:
      - http://localhost:4200
    cabeceras-permitidas:
      - Authorization
      - Content-Type
      - X-Dev-Usuario      # solo desarrollo: identidad simulada
      - X-Dev-Roles        # solo desarrollo
  jwt:
    clave-publica-archivo: ${JWT_PUBLIC_KEY_FILE:./certs/jwt-public.pem}
  correo:
    modo: SIMULADO
    resultado-simulado: OK
  notificaciones:
    habilitada: true
    url-sistema: http://localhost:4200